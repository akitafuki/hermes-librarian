<!-- Kanban Item Card -->
<div id="link-item-{{ item.id }}" class="bg-white dark:bg-slate-800/90 rounded-lg p-3 border border-slate-200 dark:border-slate-700/80 shadow-sm hover:shadow transition group">
  
  <div class="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 mb-1.5">
    <span class="truncate max-w-[70%] font-medium text-slate-600 dark:text-slate-300">
      {{ item.domain }}
    </span>
    <span class="text-[10px] font-mono uppercase px-1 py-0.5 rounded bg-slate-100 dark:bg-slate-700/60">
      {{ item.entry_type.value }}
    </span>
  </div>

  <h4 class="font-semibold text-xs leading-snug text-slate-900 dark:text-white line-clamp-2 mb-2 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition">
    <a href="/reader/{{ item.id }}">
      {{ item.title }}
    </a>
  </h4>

  <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700/50">
    <!-- Quick Status Changer -->
    <select 
      onchange="updateLinkStatus('{{ item.id }}', this.value); window.location.reload();"
      class="text-[10px] font-medium py-0.5 px-1.5 rounded border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300"
    >
      <option value="inbox" {% if item.status.value == 'inbox' %}selected{% endif %}>Inbox</option>
      <option value="reading" {% if item.status.value == 'reading' %}selected{% endif %}>Reading</option>
      <option value="favorite" {% if item.status.value == 'favorite' %}selected{% endif %}>Favorite</option>
      <option value="archived" {% if item.status.value == 'archived' %}selected{% endif %}>Archived</option>
    </select>

    <div class="flex items-center space-x-1.5 text-slate-400">
      <span class="text-[10px]">{{ item.reading_time_minutes }}m</span>
      <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer" class="hover:text-slate-600 dark:hover:text-slate-200" title="External link">
        <i data-lucide="external-link" class="w-3 h-3"></i>
      </a>
      <button onclick="deleteLink('{{ item.id }}', '{{ item.title|replace('\'', '\\\'') }}')" class="hover:text-red-500" title="Delete">
        <i data-lucide="trash-2" class="w-3 h-3"></i>
      </button>
    </div>
  </div>

</div>
