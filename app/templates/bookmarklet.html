<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saving to Hermes Librarian...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 max-w-sm w-full shadow-2xl text-center">
    
    <div id="status-icon" class="w-12 h-12 mx-auto mb-4 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center">
      <svg class="animate-spin h-6 w-6 text-blue-400" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
    </div>

    <h3 id="status-title" class="font-bold text-base mb-1">Archiving Link...</h3>
    <p id="status-sub" class="text-xs text-slate-400 truncate mb-4">{{ url }}</p>

    <div id="quote-preview" class="hidden text-xs text-left bg-slate-900/60 p-3 rounded-lg border border-slate-700/60 text-slate-300 italic mb-4 max-h-24 overflow-y-auto">
      "{{ quote }}"
    </div>

    <div id="btn-container" class="flex justify-center">
      <button onclick="window.close()" class="text-xs text-slate-400 hover:text-white transition">Close Window</button>
    </div>

  </div>

  <script>
    const url = {{ url | tojson }};
    const title = {{ title | tojson }};
    const quote = {{ quote | tojson }};

    if (quote) {
      document.getElementById('quote-preview').classList.remove('hidden');
    }

    async function save() {
      if (!url) {
        document.getElementById('status-title').textContent = 'No URL Provided';
        return;
      }

      try {
        const urlParams = new URLSearchParams(window.location.search);
        const apiKey = urlParams.get('api_key') || localStorage.getItem('hlib_api_key');
        const headers = { 'Content-Type': 'application/json' };
        if (apiKey) {
          headers['Authorization'] = `Bearer ${apiKey}`;
          headers['X-API-Key'] = apiKey;
        }

        const res = await fetch('/api/links', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({
            url: url,
            title: title || undefined,
            user_notes: quote ? ('Highlighted Quote:\n' + quote) : undefined,
            status: 'inbox',
          })
        });

        if (!res.ok) throw new Error('Failed to archive');

        const data = await res.json();
        document.getElementById('status-icon').innerHTML = `
          <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        `;
        document.getElementById('status-icon').className = "w-12 h-12 mx-auto mb-4 rounded-full bg-emerald-600/20 text-emerald-400 flex items-center justify-center";
        document.getElementById('status-title').textContent = 'Archived to Vault!';
        document.getElementById('status-sub').textContent = data.title;

        setTimeout(() => {
          window.close();
        }, 1400);

      } catch (err) {
        document.getElementById('status-title').textContent = 'Error Archiving';
        document.getElementById('status-sub').textContent = err.message;
      }
    }

    save();
  </script>
</body>
</html>
